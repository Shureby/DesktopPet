name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - run: npm run set-version -- --check
      - run: npm run test-checklist -- --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p desktoppet --features steam -- -D warnings
      - run: cargo test --workspace

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS
            os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # Website ("direct") build: signed installers once signing secrets are configured.
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: direct-${{ matrix.name }}
          path: |
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

  e2e:
    # The real app driven through WebDriver (README.md, "Automated tests of the real app"). The report
    # maps results to checklist items; the online checklist shows them.
    name: End-to-end (Windows)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx tauri build --debug --no-bundle
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Edge WebDriver matching WebView2
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $version = (Get-ItemProperty -Path $key).pv
          Write-Host "WebView2 $version"
          New-Item -ItemType Directory -Force -Path webdriver | Out-Null
          try {
            Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile webdriver\edgedriver.zip
            Expand-Archive webdriver\edgedriver.zip -DestinationPath webdriver -Force
          } catch {
            Write-Host "Download failed ($_); using the runner's Edge WebDriver"
            Copy-Item "$env:EDGEWEBDRIVER\msedgedriver.exe" webdriver\
          }
          & webdriver\msedgedriver.exe --version
      - name: Unit tests (for the report)
        run: npx vitest run --reporter=default --reporter=json --outputFile.json=e2e-results/unit.json
      - name: End-to-end tests
        if: success() || failure()
        timeout-minutes: 15
        run: npm run e2e
        env:
          EPET_APP: ${{ github.workspace }}\target\debug\desktoppet.exe
          NATIVE_DRIVER: ${{ github.workspace }}\webdriver\msedgedriver.exe
      - name: Report by checklist item
        if: always()
        run: node scripts/e2e-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: e2e-results
          if-no-files-found: warn

  steam:
    name: Steam depot (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx tauri build --no-bundle --features steam
      - run: node scripts/steam-depot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: steam-depot-windows
          path: build/steam-depot
          if-no-files-found: error
