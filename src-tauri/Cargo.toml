[package]
name = "desktoppet"
description = "Desktop pet with reminders, a tomato clock and mini-games."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "desktoppet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["direct"]
# Storefront flavours: build exactly one for a release.
direct = []
steam = ["dep:steamworks"]
epic = []
# "ePet Test" (src-tauri/tauri.test.conf.json): the tray can set the clock ahead.
testbuild = []

[dependencies]
desktoppet-core = { path = "../crates/desktoppet-core" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "macos-private-api", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
log = "0.4"
steamworks = { version = "0.12", optional = true }
# Pet Post (LocalSend protocol): HTTPS server and client, multicast discovery.
tokio = { version = "1", features = ["net", "io-util", "fs", "time", "sync", "macros", "rt"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Media_Audio",
  "Win32_Media_MediaFoundation",
  "Win32_Globalization",
] }
# `#[implement]` (a COM callback for the camera monitor, desktop/windows.rs) names this crate.
windows-core = "0.61"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.24"
